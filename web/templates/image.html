<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2d;
      --panel-alt: #17213b;
      --text: #edf2ff;
      --muted: #9aa9c7;
      --accent: #ff79c6;
      --accent-2: #8be9fd;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 18px 40px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top, #162444, var(--bg) 52%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .title {
      font-size: clamp(1.8rem, 2vw, 2.6rem);
      margin: 0;
      letter-spacing: 0.02em;
    }
    .badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 121, 198, 0.12);
      color: var(--accent-2);
      border: 1px solid rgba(139, 233, 253, 0.25);
      font-size: 0.8rem;
      font-weight: 700;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: linear-gradient(180deg, rgba(23,33,59,0.96), rgba(18,26,45,0.95));
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(255, 121, 198, 0.75);
      box-shadow: 0 22px 45px rgba(255, 121, 198, 0.16);
    }
    .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(255,121,198,0.15), rgba(139,233,253,0.12));
      transition: transform 0.25s ease;
    }
    .card:hover .thumb {
      transform: scale(1.04);
    }
    .name {
      display: block;
      padding: 12px 14px;
      font-size: 0.92rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
    }
    .viewer {
      background: linear-gradient(180deg, rgba(23,33,59,0.94), rgba(11,16,32,0.96));
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .viewer img {
      display: block;
      max-width: 100%;
      max-height: 72vh;
      margin: 0 auto 18px;
      border-radius: 14px;
      background: #0b1020;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .viewer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 0 4px;
    }
    .filename {
      color: var(--text);
      font-weight: 700;
      word-break: break-all;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      border: 1px solid transparent;
      transition: opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.95; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #ff9ac8);
      color: #1a1020;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.04);
      border-color: var(--border);
      color: var(--text);
    }
    .empty {
      padding: 30px;
      border-radius: 16px;
      border: 1px dashed rgba(255,255,255,0.15);
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      text-align: center;
    }
    a.back-link {
      color: var(--accent-2);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 class="title">Thư viện ảnh</h1>
      <span class="badge">__COUNT__ ảnh</span>
    </div>

    __CONTENT__
  </div>
  <script src="/static/js/i18n.js"></script>
</body>
</html>
